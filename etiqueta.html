<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor y Generador de Etiquetas PANROD</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
        }
        
        /* Contenedor del Editor */
        .editor-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 420px;
        }
        .editor-container h2 {
            margin-top: 0;
            color: #1a1a1a;
            font-size: 20px;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
            color: #4a5568;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            color: #334155;
            transition: border 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .btn-download {
            background-color: #1e293b;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn-download:hover {
            background-color: #0f172a;
        }

        /* Contenedor de la Vista Previa (Etiqueta Real) */
        .preview-container {
            position: sticky;
            top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        
        /* DISEÑO PROFESIONAL DE LA ETIQUETA */
        .label-ticket {
            width: 450px;
            background: white;
            padding: 20px;
            color: black;
            position: relative;
        }
        
        /* Encabezado */
        .label-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid black;
            padding-bottom: 12px;
        }
        .logo-placeholder {
            width: 110px;
            height: auto;
            max-height: 60px;
            object-fit: contain;
        }
        .company-details {
            font-size: 11px;
            line-height: 1.4;
            text-align: right;
            color: #333;
            max-width: 260px;
        }
        .company-title {
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        /* Sección Badge de Ruta */
        .barcode-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
        .xbg-badge {
            background: black;
            color: white;
            font-weight: 800;
            padding: 6px 14px;
            font-size: 16px;
            letter-spacing: 0.5px;
            border-radius: 2px;
        }
        .dispatch-mode {
            font-size: 12px;
            font-weight: 700;
            border: 2px solid black;
            padding: 4px 10px;
            letter-spacing: 0.5px;
        }
        
        /* Código de barras */
        .barcode-container {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px dashed #666;
        }
        .barcode-render {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 60px;
            width: 90%;
            margin: 0 auto;
            overflow: hidden;
        }
        .barcode-bar {
            background-color: black;
            height: 100%;
        }
        .barcode-space {
            background-color: transparent;
            height: 100%;
        }
        .barcode-num {
            font-size: 16px;
            letter-spacing: 3px;
            margin-top: 6px;
            font-weight: 700;
        }

        /* Bloque Central de Seguimiento y HUB */
        .hub-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #666;
        }
        .box-badge {
            border: 2px solid black;
            font-size: 26px;
            font-weight: 800;
            padding: 4px 10px;
            min-width: 55px;
            text-align: center;
        }
        .hub-center-container {
            text-align: center;
        }
        .tracking-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #555;
            margin-bottom: 2px;
        }
        .hub-title {
            font-size: 44px;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1;
            text-transform: uppercase;
        }

        /* Ruta interna */
        .route-section {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 0;
            letter-spacing: 2px;
            background-color: #f8fafc;
            border-bottom: 2px solid black;
        }

        /* Sección del Cliente */
        .client-section {
            padding-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            min-height: 110px;
        }
        .client-info {
            width: 72%;
            font-size: 14px;
            line-height: 1.5;
        }
        .client-info div {
            margin-bottom: 4px;
            color: #222;
        }
        .client-info .bold-text {
            font-weight: 700;
            color: black;
            display: inline-block;
            width: 75px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Gráficos QR */
        .graphics-container {
            width: 25%;
            display: flex;
            justify-content: flex-end;
        }
        .qr-placeholder {
            width: 85px;
            height: 85px;
            object-fit: contain;
        }
        
        /* El "13" manuscrito ahora se ve más integrado y realista */
        .handwritten-marker {
            position: absolute;
            right: 105px;
            top: 12px;
            font-family: 'Courier New', monospace, sans-serif;
            font-size: 70px;
            font-weight: 900;
            color: rgba(26, 26, 36, 0.85);
            transform: rotate(-7deg);
            user-select: none;
            pointer-events: none;
        }

        /* Pie de página corporativo */
        .footer-text {
            text-align: center;
            font-size: 10px;
            font-weight: 800;
            margin-top: 15px;
            letter-spacing: 2px;
            border-top: 2px solid black;
            padding-top: 8px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="editor-container">
        <h2>Editor de Etiqueta</h2>
        
        <div class="form-group">
            <label>Subir Logo de la Empresa (PANROD)</label>
            <input type="file" id="input-logo" accept="image/*">
        </div>

        <div class="form-group">
            <label>Subir Código QR Destino</label>
            <input type="file" id="input-qr" accept="image/*">
        </div>

        <div class="form-group">
            <label>Datos de Origen (Empresa)</label>
            <textarea id="txt-origen" rows="3">PANROD LOGÍSTICA S.A.&#10;Oficina Central (Origen)&#10;Av. Córdoba 1351, Piso 3 - OF 7&#10;Tel: +54 9 221 310-9897</textarea>
        </div>

        <div class="form-group">
            <label>Modo de Despacho</label>
            <input type="text" id="txt-despacho" value="CAMIONETA">
        </div>

        <div class="form-group">
            <label>Código de Seguimiento / HUB</label>
            <input type="text" id="txt-hub" value="HUB7">
        </div>

        <div class="form-group">
            <label>Número de Envío (Código de barras)</label>
            <input type="text" id="txt-barcode-num" value="58392140682">
        </div>

        <div class="form-group">
            <label>Nombre y Apellido del Cliente</label>
            <input type="text" id="txt-cliente-nombre" value="Susana Sánchez Cuba">
        </div>

        <div class="form-group">
            <label>DNI del Cliente</label>
            <input type="text" id="txt-cliente-dni" value="94.404.743">
        </div>

        <div class="form-group">
            <label>Detalle del Pedido</label>
            <input type="text" id="txt-cliente-pedido" value="COMBO PLATINO">
        </div>

        <button class="btn-download" id="btn-capture">Descargar Etiqueta (PNG)</button>
    </div>

    <div class="preview-container">
        <div class="label-ticket" id="etiqueta-descargar">
            
            <div class="label-header">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='50'><text x='0' y='32' font-family='Arial' font-size='18' font-weight='900' fill='black'>PANROD</text></svg>" class="logo-placeholder" id="lbl-logo" alt="Logo">
                <div class="company-details" id="lbl-origen"></div>
            </div>

            <div class="barcode-section">
                <div class="xbg-badge">XBG1</div>
                <div class="dispatch-mode" id="lbl-despacho">DESPACHO: CAMIONETA</div>
            </div>

            <div class="barcode-container">
                <div class="barcode-render" id="barcode-render"></div>
                <div class="barcode-num" id="lbl-barcode-num">58392140682</div>
            </div>

            <div class="hub-section">
                <div class="box-badge">28</div>
                <div class="hub-center-container">
                    <div class="tracking-title">Código de seguimiento</div>
                    <div class="hub-title" id="lbl-hub">HUB7</div>
                </div>
                <div class="box-badge">R</div>
            </div>

            <div class="route-section">
                XBG1 &gt; SET1 &gt; A2
            </div>

            <div class="client-section">
                <div class="client-info">
                    <div><span class="bold-text">Cliente:</span> <span id="lbl-nom"></span></div>
                    <div><span class="bold-text">DNI:</span> <span id="lbl-dni"></span></div>
                    <div><span class="bold-text">Pedido:</span> <span id="lbl-ped"></span></div>
                </div>
                
                <div class="handwritten-marker">13</div>

                <div class="graphics-container">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><rect width='80' height='80' fill='%23ffffff' stroke='black' stroke-width='2'/><line x1='10' y1='10' x2='70' y2='70' stroke='%23ccc'/><line x1='70' y1='10' x2='10' y2='70' stroke='%23ccc'/><text x='25' y='45' font-family='Arial' font-size='12' font-weight='bold'>QR</text></svg>" class="qr-placeholder" id="lbl-qr" alt="QR">
                </div>
            </div>

            <div class="footer-text">
                Sistema de Distribución Nacional • PANROD
            </div>

        </div>
    </div>

    <script>
        // Elementos del formulario
        const txtOrigen = document.getElementById('txt-origen');
        const txtDespacho = document.getElementById('txt-despacho');
        const txtHub = document.getElementById('txt-hub');
        const txtBarcodeNum = document.getElementById('txt-barcode-num');
        const txtNombre = document.getElementById('txt-cliente-nombre');
        const txtDni = document.getElementById('txt-cliente-dni');
        const txtPedido = document.getElementById('txt-cliente-pedido');
        const inputLogo = document.getElementById('input-logo');
        const inputQr = document.getElementById('input-qr');

        // Elementos visuales de la etiqueta
        const lblOrigen = document.getElementById('lbl-origen');
        const lblDespacho = document.getElementById('lbl-despacho');
        const lblHub = document.getElementById('lbl-hub');
        const lblBarcodeNum = document.getElementById('lbl-barcode-num');
        const lblNom = document.getElementById('lbl-nom');
        const lblDni = document.getElementById('lbl-dni');
        const lblPed = document.getElementById('lbl-ped');
        const lblLogo = document.getElementById('lbl-logo');
        const lblQr = document.getElementById('lbl-qr');
        const barcodeRender = document.getElementById('barcode-render');

        // Función pseudo-aleatoria para barras
        function generarCodigoBarras(numero) {
            barcodeRender.innerHTML = '';
            if(!numero) numero = "0";
            
            let semilla = numero.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            let patron = [1, 0, 1, 0];
            
            for (let i = 0; i < 40; i++) {
                semilla = (semilla * 9301 + 49297) % 233280;
                let grosorBarra = (semilla % 3) + 1; 
                let grosorEspacio = ((semilla >> 2) % 3) + 1;
                
                for(let b=0; b<grosorBarra; b++) patron.push(1);
                for(let e=0; e<grosorEspacio; e++) patron.push(0);
            }
            
            patron.push(1, 0, 1);

            patron.forEach(tipo => {
                const elemento = document.createElement('div');
                elemento.className = tipo === 1 ? 'barcode-bar' : 'barcode-space';
                elemento.style.width = '2px';
                barcodeRender.appendChild(elemento);
            });
        }

        // Actualizar datos en vivo
        function actualizarEtiqueta() {
            // Dividir la primera línea del remitente para ponerle negrita estilizada
            let lineas = txtOrigen.value.split('\n');
            if(lineas.length > 0) {
                lineas[0] = `<div class="company-title">${lineas[0]}</div>`;
            }
            lblOrigen.innerHTML = lineas.join('<br>');
            
            lblDespacho.textContent = 'DESPACHO: ' + txtDespacho.value.toUpperCase();
            lblHub.textContent = txtHub.value.toUpperCase();
            lblBarcodeNum.textContent = txtBarcodeNum.value;
            lblNom.textContent = txtNombre.value;
            lblDni.textContent = txtDni.value;
            lblPed.textContent = txtPedido.value;
            
            generarCodigoBarras(txtBarcodeNum.value);
        }

        // Listeners de edición
        txtOrigen.addEventListener('input', actualizarEtiqueta);
        txtDespacho.addEventListener('input', actualizarEtiqueta);
        txtHub.addEventListener('input', actualizarEtiqueta);
        txtBarcodeNum.addEventListener('input', actualizarEtiqueta);
        txtNombre.addEventListener('input', actualizarEtiqueta);
        txtDni.addEventListener('input', actualizarEtiqueta);
        txtPedido.addEventListener('input', actualizarEtiqueta);

        // Inputs de archivos
        inputLogo.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { lblLogo.src = e.target.result; }
                reader.readAsDataURL(file);
            }
        });

        inputQr.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { lblQr.src = e.target.result; }
                reader.readAsDataURL(file);
            }
        });

        // Carga inicial
        actualizarEtiqueta();

        // Capturar como PNG
        document.getElementById('btn-capture').addEventListener('click', function() {
            const objetivo = document.getElementById('etiqueta-descargar');
            
            html2canvas(objetivo, {
                scale: 3, // Mayor escala para una nitidez perfecta en impresión
                backgroundColor: "#ffffff",
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'etiqueta_' + txtNombre.value.replace(/\s+/g, '_') + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
    </html>
