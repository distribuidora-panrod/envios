<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Etiquetas Térmicas PANROD</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: #f1f5f9;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
        }
        
        /* Contenedor del Editor */
        .editor-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 450px;
            height: 90vh;
            overflow-y: auto;
        }
        .editor-container h2 {
            margin-top: 0;
            color: #0f172a;
            font-size: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 16px;
        }
        .form-group {
            flex: 1;
            margin-bottom: 16px;
        }
        .form-row .form-group {
            margin-bottom: 0;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 12px;
            color: #475569;
            text-transform: uppercase;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            color: #1e293b;
            transition: border 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }

        /* Botones de Descarga */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }
        .btn-png { background-color: #334155; }
        .btn-png:hover { background-color: #1e293b; }
        .btn-pdf { background-color: #b91c1c; }
        .btn-pdf:hover { background-color: #991b1b; }

        /* Contenedor de la Vista Previa */
        .preview-container {
            position: sticky;
            top: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border-radius: 4px;
            overflow: hidden;
            background: white;
        }
        
        /* DISEÑO DE ETIQUETA TÉRMICA (10x15cm exactos) */
        .label-ticket {
            width: 400px;
            height: 600px;
            background: white;
            padding: 20px;
            color: black;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        /* 1. Encabezado: Logo y Origen */
        .label-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid black;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .logo-placeholder {
            max-width: 140px;
            max-height: 45px;
            object-fit: contain;
        }
        .company-details {
            font-size: 10px;
            line-height: 1.3;
            text-align: right;
            max-width: 200px;
        }
        .company-title {
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        /* 2. Sección del Cliente y QR (CORREGIDA LA DEFORMACIÓN) */
        .client-section {
            display: flex;
            justify-content: space-between;
            align-items: center; /* Alineación vertical centralizada */
            border-bottom: 2px solid black;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .client-info {
            width: 72%;
            display: flex;
            flex-direction: column;
            gap: 4px; /* Espaciado compacto entre líneas */
        }
        .client-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #333;
        }
        .client-name {
            font-size: 19px;
            font-weight: 800;
            line-height: 1.1;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .client-data {
            font-size: 14px;
            line-height: 1.4;
        }
        .qr-placeholder {
            width: 85px;
            height: 85px;
            object-fit: contain;
        }

        /* 3. Bloque de Enrutamiento (HUB) */
        .routing-block {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            border: 3px solid black;
            margin-bottom: 8px;
            height: 85px;
        }
        .route-badge {
            background: black;
            color: white;
            font-weight: 900;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 25%;
            text-align: center;
        }
        .hub-center {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            font-size: 50px;
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1;
        }
        .box-badge {
            border-left: 3px solid black;
            display: flex;
            flex-direction: column;
            width: 20%;
        }
        .box-badge div {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
        }
        .box-badge div:first-child {
            border-bottom: 3px solid black;
        }

        /* 4. Sub-rutas y modo de despacho */
        .route-path {
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 8px 0;
            border-bottom: 2px dashed black;
            margin-bottom: 12px;
        }
        .dispatch-mode {
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* 5. Código de barras (Empujado hacia abajo de forma limpia) */
        .barcode-container {
            text-align: center;
            margin-top: auto; /* Esto empuja el código de barras al fondo sin estirar lo de arriba */
            padding-top: 10px;
        }
        .barcode-render {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 75px;
            width: 100%;
        }
        .barcode-bar { background-color: black; height: 100%; }
        .barcode-space { background-color: transparent; height: 100%; }
        
        .barcode-num {
            font-size: 16px;
            letter-spacing: 4px;
            margin-top: 5px;
            font-weight: 800;
        }

    </style>
</head>
<body>

    <div class="editor-container">
        <h2>Configuración de Etiqueta</h2>
        
        <div class="form-row">
            <div class="form-group">
                <label>Logo de la Empresa</label>
                <input type="file" id="input-logo" accept="image/*">
            </div>
            <div class="form-group">
                <label>Código QR</label>
                <input type="file" id="input-qr" accept="image/*">
            </div>
        </div>

        <div class="form-group">
            <label>Datos de Origen (Remitente)</label>
            <textarea id="txt-origen" rows="3">PANROD LOGÍSTICA S.A.&#10;Av. Córdoba 1351, Piso 3 - OF 7&#10;Tel: +54 9 221 310-9897</textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Nombre del Destinatario</label>
                <input type="text" id="txt-cliente-nombre" value="Susana Sánchez Cuba">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>DNI</label>
                <input type="text" id="txt-cliente-dni" value="94.404.743">
            </div>
            <div class="form-group">
                <label>Pedido / Lote</label>
                <input type="text" id="txt-cliente-pedido" value="COMBO PLATINO">
            </div>
        </div>

        <hr style="border:1px solid #e2e8f0; margin: 20px 0;">

        <div class="form-row">
            <div class="form-group">
                <label>Código HUB Central</label>
                <input type="text" id="txt-hub" value="HUB7">
            </div>
            <div class="form-group">
                <label>Zona (Insignia Oscura)</label>
                <input type="text" id="txt-zona" value="XBG1">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Cuadro Lateral 1</label>
                <input type="text" id="txt-box1" value="28">
            </div>
            <div class="form-group">
                <label>Cuadro Lateral 2</label>
                <input type="text" id="txt-box2" value="R">
            </div>
        </div>

        <div class="form-group">
            <label>Ruta de Derivación</label>
            <input type="text" id="txt-ruta" value="XBG1 > SET1 > A2">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Modo de Despacho</label>
                <input type="text" id="txt-despacho" value="CAMIONETA">
            </div>
            <div class="form-group">
                <label>Número de Tracking</label>
                <input type="text" id="txt-barcode-num" value="58392140682">
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-png" id="btn-png">🖼️ Descargar PNG</button>
            <button class="btn btn-pdf" id="btn-pdf">📄 Descargar PDF</button>
        </div>
    </div>

    <div class="preview-container">
        <div class="label-ticket" id="etiqueta-descargar">
            
            <div class="label-header">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='40'><text x='0' y='30' font-family='Arial' font-size='24' font-weight='900' fill='black'>PANROD</text></svg>" class="logo-placeholder" id="lbl-logo" alt="Logo">
                <div class="company-details" id="lbl-origen"></div>
            </div>

            <div class="client-section">
                <div class="client-info">
                    <div class="client-title">Entregar a:</div>
                    <div class="client-name" id="lbl-nom"></div>
                    <div class="client-data">
                        <strong>DNI:</strong> <span id="lbl-dni"></span><br>
                        <strong>CONTENIDO:</strong> <span id="lbl-ped"></span>
                    </div>
                </div>
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><rect width='90' height='90' fill='%23ffffff' stroke='black' stroke-width='4'/><rect x='15' y='15' width='20' height='20' fill='black'/><rect x='55' y='15' width='20' height='20' fill='black'/><rect x='15' y='55' width='20' height='20' fill='black'/><rect x='60' y='60' width='15' height='15' fill='black'/></svg>" class="qr-placeholder" id="lbl-qr" alt="QR">
            </div>

            <div class="routing-block">
                <div class="route-badge" id="lbl-zona"></div>
                <div class="hub-center" id="lbl-hub"></div>
                <div class="box-badge">
                    <div id="lbl-box1"></div>
                    <div id="lbl-box2"></div>
                </div>
            </div>

            <div class="route-path" id="lbl-ruta"></div>
            <div class="dispatch-mode" id="lbl-despacho"></div>

            <div class="barcode-container">
                <div class="barcode-render" id="barcode-render"></div>
                <div class="barcode-num" id="lbl-barcode-num"></div>
            </div>

        </div>
    </div>

    <script>
        // Inicializar jsPDF
        window.jsPDF = window.jspdf.jsPDF;

        // Obtener inputs
        const inputs = {
            origen: document.getElementById('txt-origen'),
            nom: document.getElementById('txt-cliente-nombre'),
            dni: document.getElementById('txt-cliente-dni'),
            ped: document.getElementById('txt-cliente-pedido'),
            hub: document.getElementById('txt-hub'),
            zona: document.getElementById('txt-zona'),
            box1: document.getElementById('txt-box1'),
            box2: document.getElementById('txt-box2'),
            ruta: document.getElementById('txt-ruta'),
            despacho: document.getElementById('txt-despacho'),
            barcode: document.getElementById('txt-barcode-num')
        };

        // Obtener labels visuales
        const labels = {
            origen: document.getElementById('lbl-origen'),
            nom: document.getElementById('lbl-nom'),
            dni: document.getElementById('lbl-dni'),
            ped: document.getElementById('lbl-ped'),
            hub: document.getElementById('lbl-hub'),
            zona: document.getElementById('lbl-zona'),
            box1: document.getElementById('lbl-box1'),
            box2: document.getElementById('lbl-box2'),
            ruta: document.getElementById('lbl-ruta'),
            despacho: document.getElementById('lbl-despacho'),
            barcode: document.getElementById('lbl-barcode-num')
        };

        const inputLogo = document.getElementById('input-logo');
        const inputQr = document.getElementById('input-qr');
        const lblLogo = document.getElementById('lbl-logo');
        const lblQr = document.getElementById('lbl-qr');
        const barcodeRender = document.getElementById('barcode-render');

        // Generador visual de código de barras
        function generarCodigoBarras(numero) {
            barcodeRender.innerHTML = '';
            if(!numero) numero = "0";
            
            let semilla = numero.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            let patron = [1, 0, 1, 0];
            
            for (let i = 0; i < 48; i++) {
                semilla = (semilla * 9301 + 49297) % 233280;
                let grosorBarra = (semilla % 4) + 1; 
                let grosorEspacio = ((semilla >> 2) % 3) + 1;
                
                for(let b=0; b<grosorBarra; b++) patron.push(1);
                for(let e=0; e<grosorEspacio; e++) patron.push(0);
            }
            
            patron.push(1, 0, 1);

            patron.forEach(tipo => {
                const elemento = document.createElement('div');
                elemento.className = tipo === 1 ? 'barcode-bar' : 'barcode-space';
                elemento.style.width = '2.5px';
                barcodeRender.appendChild(elemento);
            });
        }

        // Función para actualizar en vivo
        function actualizarEtiqueta() {
            let lineas = inputs.origen.value.split('\n');
            if(lineas.length > 0) { lineas[0] = `<div class="company-title">${lineas[0]}</div>`; }
            labels.origen.innerHTML = lineas.join('<br>');
            
            labels.nom.textContent = inputs.nom.value;
            labels.dni.textContent = inputs.dni.value;
            labels.ped.textContent = inputs.ped.value;
            labels.hub.textContent = inputs.hub.value.toUpperCase();
            labels.zona.textContent = inputs.zona.value.toUpperCase();
            labels.box1.textContent = inputs.box1.value.toUpperCase();
            labels.box2.textContent = inputs.box2.value.toUpperCase();
            labels.ruta.textContent = inputs.ruta.value.toUpperCase();
            labels.despacho.textContent = 'DESPACHO: ' + inputs.despacho.value.toUpperCase();
            labels.barcode.textContent = inputs.barcode.value;
            
            generarCodigoBarras(inputs.barcode.value);
        }

        Object.values(inputs).forEach(input => {
            input.addEventListener('input', actualizarEtiqueta);
        });

        // Imágenes
        inputLogo.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => lblLogo.src = e.target.result;
                reader.readAsDataURL(file);
            }
        });

        inputQr.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => lblQr.src = e.target.result;
                reader.readAsDataURL(file);
            }
        });

        actualizarEtiqueta();

        // ----------------------------------------------------
        // FUNCIONES DE DESCARGA (PNG y PDF)
        // ----------------------------------------------------
        
        async function capturarEtiqueta() {
            const objetivo = document.getElementById('etiqueta-descargar');
            return await html2canvas(objetivo, {
                scale: 3, // Alta calidad
                backgroundColor: "#ffffff",
                useCORS: true
            });
        }

        // Descargar como PNG
        document.getElementById('btn-png').addEventListener('click', async function() {
            const canvas = await capturarEtiqueta();
            const link = document.createElement('a');
            link.download = 'etiqueta_' + inputs.nom.value.replace(/\s+/g, '_') + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Descargar como PDF (10x15 cm)
        document.getElementById('btn-pdf').addEventListener('click', async function() {
            const canvas = await capturarEtiqueta();
            const imgData = canvas.toDataURL('image/png');
            
            // Crear PDF con dimensiones 100x150 mm (10x15 cm)
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: [100, 150]
            });
            
            // Insertar imagen cubriendo todo el canvas
            pdf.addImage(imgData, 'PNG', 0, 0, 100, 150);
            pdf.save('etiqueta_' + inputs.nom.value.replace(/\s+/g, '_') + '.pdf');
        });
    </script>
</body>
                </html>
