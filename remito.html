<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Remito de Entrega - PANROD LOGÍSTICA S.A.</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @page { size: A4; margin: 15mm 12mm; }
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 0; color: #2d3748; background-color: #ffffff; font-size: 10pt; line-height: 1.4; padding-bottom: 80px; }
        .printable-content { background-color: #ffffff; padding: 5px; }
        .invoice-box { border: 1px solid #1a202c; position: relative; margin-bottom: 20px; }
        .letter-badge { position: absolute; top: 0; left: 50%; transform: translateX(-50%); border-left: 1px solid #1a202c; border-right: 1px solid #1a202c; border-bottom: 1px solid #1a202c; width: 45px; height: 45px; text-align: center; background: #ffffff; z-index: 10; }
        .letter-badge .letter { font-size: 22pt; font-weight: 800; line-height: 42px; display: block; }
        .letter-badge .sub-letter { font-size: 6pt; display: block; margin-top: -5px; color: #4a5568; }
        .header-table { width: 100%; border-collapse: collapse; }
        .header-table td { width: 50%; padding: 20px; vertical-align: top; }
        .left-header { border-right: 1px solid #1a202c; }
        .company-title { font-size: 16pt; font-weight: 800; color: #1a202c; margin: 0 0 5px 0; }
        .company-subtitle { font-size: 9pt; text-transform: uppercase; color: #4a5568; font-weight: bold; margin-bottom: 10px; }
        .document-title { font-size: 20pt; font-weight: 800; letter-spacing: 2px; margin: 0 0 10px 0; color: #1a202c; text-align: right; }
        .tracking-banner { background-color: #1a202c; color: #ffffff; padding: 12px 20px; margin-bottom: 20px; border-radius: 2px; }
        .info-grid { width: 100%; margin-bottom: 20px; border-collapse: collapse; }
        .info-block { width: 50%; border: 1px solid #cbd5e0; padding: 15px; vertical-align: top; }
        .items-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        .items-table th { background-color: #f1f5f9; padding: 10px; border: 1px solid #cbd5e0; text-transform: uppercase; font-weight: bold; }
        .items-table td { padding: 12px 10px; border: 1px solid #cbd5e0; }
        .signatures-container { margin-top: 50px; width: 100%; page-break-inside: avoid; }
        .signature-block { width: 48%; display: inline-block; border: 1px solid #cbd5e0; background: #f8fafc; padding: 20px; vertical-align: top; text-align: center; }
        .signature-canvas-wrapper { width: 100%; height: 80px; margin-top: 15px; border: 1px dashed #cbd5e0; display: flex; align-items: center; justify-content: center; }
        .btn-clear-sig { background: #cbd5e0; border: none; color: #4a5568; padding: 2px 8px; cursor: pointer; font-weight: bold; }
        .action-panel { position: fixed; bottom: 20px; right: 20px; background: rgba(255, 255, 255, 0.98); padding: 12px; border-radius: 8px; box-shadow: 0 4px 25px rgba(0,0,0,0.2); z-index: 10000; display: flex; gap: 8px; }
        .btn { padding: 10px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-pdf { background-color: #dc2626; color: white; }
        .btn-img { background-color: #2563eb; color: white; }
        @media print { .action-panel { display: none !important; } }
    </style>
</head>
<body>

    <div class="action-panel" id="actionPanel">
        <button class="btn btn-pdf" onclick="exportarPDF()">Descargar PDF</button>
        <button class="btn btn-img" onclick="exportarImagen()">Descargar Imagen</button>
    </div>

    <div class="printable-content" id="remitoContainer">
        <div class="invoice-box">
            <div class="letter-badge"><span class="letter">A</span><span class="sub-letter">REMITO</span></div>
            <table class="header-table">
                <tr>
                    <td class="left-header">
                        <h1 class="company-title" contenteditable="true">PANROD LOGÍSTICA S.A.</h1>
                        <div class="company-subtitle" contenteditable="true">Distribuidora de Paquetería</div>
                    </td>
                    <td>
                        <h2 class="document-title">REMITO</h2>
                        <div contenteditable="true"><strong>Documento N°:</strong> 0001-00094772</div>
                    </td>
                </tr>
            </table>
        </div>

        <div class="tracking-banner">
            <div class="tracking-code-value" contenteditable="true">CÓDIGO: ACC-94772</div>
        </div>

        <table class="items-table">
            <thead>
                <tr><th>Código</th><th>Descripción</th><th>Cantidad</th></tr>
            </thead>
            <tbody>
                <tr>
                    <td contenteditable="true">84377594200009</td>
                    <td contenteditable="true">Mercancía Liviana de Distribución</td>
                    <td contenteditable="true">200 Unidades</td>
                </tr>
            </tbody>
        </table>

        <div class="signatures-container">
            <div class="signature-block">
                <strong>FIRMA DEL TRANSPORTISTA</strong>
                <div class="signature-canvas-wrapper" id="firmaWrapper">
                    <input type="file" id="firmaInput" accept="image/*" onchange="cargarFirma(event)">
                    <img id="firmaTransportistaImg" style="max-width: 100%; max-height: 100%; display: none;" />
                </div>
                <button class="btn-clear-sig" id="btnBorrarFirma" onclick="borrarFirmaImg()" style="display:none;">Quitar Firma</button>
            </div>
            <div class="signature-block" style="float: right;">
                <strong>RECEPCIÓN CONFORME CLIENTE</strong>
                <div style="height: 80px; margin-top: 15px; border-bottom: 1px dashed #718096;"></div>
            </div>
        </div>
    </div>

    <script>
        function cargarFirma(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('firmaTransportistaImg');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    document.getElementById('firmaInput').style.display = 'none';
                    document.getElementById('btnBorrarFirma').style.display = 'inline-block';
                }
                reader.readAsDataURL(file);
            }
        }

        function borrarFirmaImg() {
            document.getElementById('firmaTransportistaImg').style.display = 'none';
            document.getElementById('firmaInput').style.display = 'block';
            document.getElementById('btnBorrarFirma').style.display = 'none';
        }

        function exportarPDF() {
            const panel = document.getElementById('actionPanel');
            panel.style.display = 'none';
            const element = document.getElementById('remitoContainer');
            html2pdf().from(element).save('Remito_PANROD.pdf').then(() => {
                panel.style.display = 'flex';
            });
        }

        function exportarImagen() {
            const panel = document.getElementById('actionPanel');
            panel.style.display = 'none';
            html2canvas(document.getElementById('remitoContainer')).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Remito_PANROD.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                panel.style.display = 'flex';
            });
        }
    </script>
</body>
</html>
